name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      SCHOLAR_USER_ID: ${{ vars.SCHOLAR_USER_ID || 'vJjq9LwAAAAJ' }}
      SCHOLAR_SOURCE_URL: ${{ vars.SCHOLAR_SOURCE_URL }}
      SCHOLAR_PROFILE_NAME: ${{ vars.SCHOLAR_PROFILE_NAME }}
      SCHOLAR_AFFILIATION: ${{ vars.SCHOLAR_AFFILIATION }}
      SCHOLAR_AVATAR_URL: ${{ vars.SCHOLAR_AVATAR_URL }}
      SCHOLAR_FETCH_DETAILS: ${{ vars.SCHOLAR_FETCH_DETAILS || 'false' }}
      SCHOLAR_CITED_LIMIT: ${{ vars.SCHOLAR_CITED_LIMIT || '0' }}
      SCHOLAR_MAX_PUBLICATIONS: ${{ vars.SCHOLAR_MAX_PUBLICATIONS || '100' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Scholar data
        continue-on-error: true
        run: |
          if [ -n "$SCHOLAR_SOURCE_URL" ]; then
            npm run import:scholar-json -- --url "$SCHOLAR_SOURCE_URL" --out public/data/scholar.json
          else
            npm run fetch:scholar -- --user "$SCHOLAR_USER_ID" --out public/data/scholar.json
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
